<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sosna</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* v1.10.290 — palette re-tuned to match the in-app sidebar
       (index.css .sidebar): slate navy top → deep near-black bottom.
       Same gradient shape the operator sees on every page. */
    body {
      background: linear-gradient(180deg, #1E293B 0%, #0F172A 50%, #020617 100%);
      color: #e2e8f0;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      user-select: none;
      -webkit-app-region: drag;
      overflow: hidden;
      position: relative;
    }

    /* Subtle glow ring behind the logo — neutral slate so it doesn't
       fight the palette. */
    body::before {
      content: '';
      position: absolute;
      top: 18%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(148,163,184,0.18) 0%, rgba(15,23,42,0) 70%);
      pointer-events: none;
      animation: glow 4s ease-in-out infinite;
    }

    /* Brand logo — larger, more prominent. Drop your Sosna logo image
       at frontend/electron/logo.png; splash prefers it and falls back
       to icon.png when logo.png is absent.
       v1.10.293 — squared the max-dimensions (180×180) and pinned
       object-fit: contain so a near-square badge like SGD SOSNA fits
       cleanly without clipping the outer ring / "GENERAL DEALERS"
       text. Previous 180×120 cap made a 1:1 image render at ~121×120,
       looking cramped inside the glow ring. */
    .logo {
      width: 180px;
      height: 180px;
      object-fit: contain;
      margin-bottom: 18px;
      animation: pulse 2.4s ease-in-out infinite;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.55));
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #ffffff;
      margin-bottom: 3px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .subtitle {
      font-size: 11px;
      letter-spacing: 3px;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .divider {
      width: 200px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(148,163,184,0.35), transparent);
      margin-bottom: 18px;
    }

    .dev-label {
      font-size: 10px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 5px;
      text-align: center;
    }

    .dev-name {
      text-align: center;
      margin-bottom: 10px;
      line-height: 1.3;
    }
    .dev-name .line1 {
      display: block;
      font-size: 17px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 4px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }
    .dev-name .line2 {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #cbd5e1;
      letter-spacing: 1.5px;
    }

    .dev-info {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.9;
      text-align: center;
      letter-spacing: 0.3px;
      /* v1.10.294 — trimmed from 22px so the loader bar + status text
         sit ~15px above the version footer inside the 440px window.
         Paired with the main.js splash window height bump; see
         createSplashWindow() there. */
      margin-bottom: 12px;
    }

    .loader-track {
      width: 240px;
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    /* Loader bar — muted slate accent that reads as an in-family
       highlight, not a foreign blue. */
    .loader-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #64748b, #cbd5e1, #64748b);
      background-size: 200% 100%;
      border-radius: 2px;
      animation: fill 8s linear forwards, shimmer 1.8s linear infinite;
      box-shadow: 0 0 10px rgba(203,213,225,0.35);
    }

    .status {
      font-size: 11px;
      color: #64748b;
      letter-spacing: 1px;
      min-height: 16px;
    }

    .version {
      position: absolute;
      bottom: 14px;
      font-size: 10px;
      color: #475569;
      letter-spacing: 1px;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes fill {
      0%   { width: 0%; }
      100% { width: 100%; }
    }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @keyframes glow {
      0%, 100% { opacity: 0.65; transform: translate(-50%, -50%) scale(1); }
      50%      { opacity: 1;    transform: translate(-50%, -50%) scale(1.08); }
    }
  </style>
</head>
<body>

  <!-- Brand logo. Prefers logo.png (drop your Sosna logo file next to
       splash.html); falls back to icon.png if the logo file isn't
       present so the splash still renders on installs that haven't
       had the logo added yet. -->
  <img class="logo" src="logo.png" alt="Sosna"
       onerror="this.onerror=null;this.src='icon.png';this.style.maxWidth='120px';this.style.maxHeight='120px';this.style.borderRadius='18px';this.style.boxShadow='0 8px 24px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.05)';" />

  <div class="title">Sosna</div>
  <div class="subtitle">Management System</div>

  <div class="divider"></div>

  <div class="dev-label">Developed by</div>
  <div class="dev-name">
    <span class="line1">SIDAN</span>
    <span class="line2">IT and Business Solutions</span>
  </div>
  <div class="dev-info">
    www.sidanitsolutions.com<br>
    +260 775 722 196 &nbsp;/&nbsp; +260 775 722 228<br>
    Lusaka, Zambia
  </div>

  <div class="loader-track">
    <div class="loader-bar"></div>
  </div>
  <div class="status" id="status">Starting...</div>

  <div class="version" id="version">v?</div>

  <script>
    // Version is passed in by main.js as ?v=1.4.75 — falls back to literal if missing.
    var v = new URLSearchParams(window.location.search).get('v');
    document.getElementById('version').textContent = v ? ('v' + v) : 'v?';
  </script>
</body>
</html>
