<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1e40af" />
<title>Sosna</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #1e40af 0%, #172554 100%);
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }
  #picker {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 24px;
  }
  .logo {
    width: 96px; height: 96px; border-radius: 22px;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    display: flex; align-items: center; justify-content: center;
    font-size: 48px; margin-bottom: 22px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.25);
  }
  h1 { margin: 0 0 4px; font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
  .subtitle { font-size: 13px; opacity: 0.7; margin-bottom: 36px; letter-spacing: 1px; text-transform: uppercase; }
  .pick-label { font-size: 13px; opacity: 0.8; margin-bottom: 14px; }
  .choices { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; }
  .choice {
    padding: 16px 20px; border-radius: 14px;
    background: rgba(255,255,255,0.08);
    border: 1.5px solid rgba(255,255,255,0.18);
    color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: transform 0.1s, background 0.15s;
    display: flex; align-items: center; justify-content: space-between;
    text-align: left;
  }
  .choice:active { transform: scale(0.97); background: rgba(255,255,255,0.18); }
  .choice .badge {
    font-size: 10px; opacity: 0.6; font-weight: 500;
    letter-spacing: 0.4px; text-transform: uppercase;
  }
  .footer {
    margin-top: 32px; font-size: 11px; opacity: 0.5;
    text-align: center;
  }
  #loading {
    min-height: 100vh;
    display: none; flex-direction: column; align-items: center; justify-content: center;
  }
  .spinner {
    width: 42px; height: 42px;
    border: 3px solid rgba(255,255,255,0.25);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-label { font-size: 13px; opacity: 0.85; }
</style>
</head>
<body>
  <!--
    v1.8.35 — first-launch host picker. Sosna has 4 separately-deployed
    sites (HQ + 3 branches); a single APK lets any operator install once
    and pick which one they belong to. Choice is persisted via
    localStorage, so subsequent launches skip the picker and go straight
    to the saved host. To change sites, user must reinstall the app
    (deliberately destructive — they shouldn't be flipping daily).
  -->
  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-label" id="loading-label">Opening Sosna…</div>
  </div>
  <div id="picker">
    <div class="logo">🚚</div>
    <h1>Sosna</h1>
    <div class="subtitle">Management System</div>

    <div class="pick-label">Choose your site:</div>
    <div class="choices" id="choices"></div>

    <div class="footer">You can change this later by reinstalling the app.</div>
  </div>

  <script>
    // Update this list AND capacitor.config.json's allowNavigation when
    // a new branch is added. Both must agree or the WebView will block
    // navigation to the new subdomain.
    const SITES = [
      { id: 'hq',            label: 'Head Office (HQ)', host: 'sosnazm.com' },
      { id: 'kassumbalesa1', label: 'Kassumbalesa 1',   host: 'kassumbalesa1.sosnazm.com' },
      { id: 'lusaka1',       label: 'Lusaka 1',         host: 'lusaka1.sosnazm.com' },
      { id: 'mansa1',        label: 'Mansa 1',          host: 'mansa1.sosnazm.com' },
    ];
    const STORAGE_KEY = 'sosna_selected_site_v1';

    function go(site) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(site)); } catch (e) {}
      document.getElementById('picker').style.display = 'none';
      const loading = document.getElementById('loading');
      loading.style.display = 'flex';
      document.getElementById('loading-label').textContent = 'Opening ' + site.label + '…';
      // Tiny delay so the spinner is visible (instant blank feels broken).
      setTimeout(function () {
        window.location.href = 'https://' + site.host + '/';
      }, 250);
    }

    function renderChoices() {
      const wrap = document.getElementById('choices');
      wrap.innerHTML = '';
      SITES.forEach(function (s) {
        const btn = document.createElement('button');
        btn.className = 'choice';
        btn.innerHTML = '<span>' + s.label + '</span><span class="badge">' + s.host + '</span>';
        btn.onclick = function () { go(s); };
        wrap.appendChild(btn);
      });
    }

    // Auto-redirect if user already picked.
    (function init() {
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (e) {}
      if (saved && saved.host) {
        return go(saved);
      }
      renderChoices();
    })();
  </script>
</body>
</html>
