<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1e40af" />
<title>Sosna</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #1e40af 0%, #172554 100%);
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }
  .screen {
    min-height: 100vh;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 24px;
  }
  .screen.active { display: flex; }
  /* v1.10.291 — SGD SOSNA badge image replaces the old truck emoji.
     Circle is already baked into the PNG so no background needed. */
  .logo {
    width: 96px; height: 96px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 18px;
  }
  .logo img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 12px 32px rgba(0,0,0,0.35)); }
  h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .subtitle { font-size: 12px; opacity: 0.7; margin-bottom: 28px; letter-spacing: 1px; text-transform: uppercase; }
  .pick-label { font-size: 13px; opacity: 0.85; margin-bottom: 14px; }
  .step-tag {
    font-size: 10px; font-weight: 700; opacity: 0.6; letter-spacing: 1px;
    text-transform: uppercase; margin-bottom: 6px;
  }
  .choices, .form-wrap { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; }
  .choice {
    padding: 16px 20px; border-radius: 14px;
    background: rgba(255,255,255,0.08);
    border: 1.5px solid rgba(255,255,255,0.18);
    color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: transform 0.1s, background 0.15s;
    display: flex; align-items: center; justify-content: space-between;
    text-align: left;
  }
  .choice:active { transform: scale(0.97); background: rgba(255,255,255,0.18); }
  .choice .badge {
    font-size: 10px; opacity: 0.6; font-weight: 500;
    letter-spacing: 0.4px; text-transform: uppercase;
  }
  .selected-branch {
    padding: 12px 16px; border-radius: 12px;
    background: rgba(255,255,255,0.12);
    border: 1.5px solid rgba(255,255,255,0.22);
    margin-bottom: 18px; text-align: center;
  }
  .selected-branch .name { font-size: 16px; font-weight: 700; }
  .selected-branch .host { font-size: 10px; opacity: 0.65; margin-top: 2px; letter-spacing: 0.4px; }
  .field {
    width: 100%; padding: 14px 16px;
    border-radius: 12px; font-size: 15px;
    background: rgba(255,255,255,0.95); color: #0f172a;
    border: 2px solid transparent; outline: none;
    font-family: monospace; letter-spacing: 1.5px; text-align: center;
    font-weight: 600;
  }
  .field:focus { border-color: #60a5fa; }
  .field.error { border-color: #f87171; background: rgba(254,226,226,0.95); }
  .err-msg { color: #fecaca; font-size: 12px; min-height: 16px; text-align: center; margin-top: 2px; }
  .btn {
    padding: 14px 20px; border-radius: 12px; border: none;
    background: #fff; color: #1e40af; font-weight: 700; font-size: 15px;
    cursor: pointer; transition: opacity 0.15s;
  }
  .btn:active { opacity: 0.85; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary {
    background: transparent; color: rgba(255,255,255,0.85);
    border: 1.5px solid rgba(255,255,255,0.3);
  }
  .footer {
    margin-top: 28px; font-size: 11px; opacity: 0.5;
    text-align: center;
  }
  .spinner {
    width: 42px; height: 42px;
    border: 3px solid rgba(255,255,255,0.25);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-label { font-size: 13px; opacity: 0.85; text-align: center; }
</style>
</head>
<body>
  <!--
    v1.8.36 — two-step first-launch flow:
      1. Pick site (HQ / Kassumbalesa1 / Lusaka1 / Mansa1)
      2. Enter license key for that site
    Both are persisted to localStorage; subsequent launches skip
    straight to the saved host. The license is stored locally as the
    operator's identifier — the website's own login still gates real
    access. Backend validation can be added later by POSTing the key
    to /api/licenses/validate before saving.
  -->

  <!-- ─── Step 1: pick branch ─────────────────────────────────────── -->
  <div id="screen-pick" class="screen active">
    <div class="logo"><img src="logo.png" alt="Sosna" /></div>
    <h1>Sosna</h1>
    <div class="subtitle">Management System</div>
    <div class="step-tag">Step 1 of 2</div>
    <div class="pick-label">Choose your site:</div>
    <div class="choices" id="choices"></div>
    <div class="footer">You can change this later by reinstalling the app.</div>
  </div>

  <!-- ─── Step 2: license entry ───────────────────────────────────── -->
  <div id="screen-license" class="screen">
    <div class="logo"><img src="logo.png" alt="Sosna" /></div>
    <h1>Sosna</h1>
    <div class="subtitle">Management System</div>
    <div class="step-tag">Step 2 of 2</div>

    <div class="selected-branch" id="branch-summary">
      <div class="name" id="branch-name">—</div>
      <div class="host" id="branch-host">—</div>
    </div>

    <div class="pick-label">Enter your access license:</div>
    <div class="form-wrap">
      <input id="license-input" class="field" type="text" placeholder="e.g. SOS-XXXX-XXXX"
        autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" />
      <div class="err-msg" id="license-err"></div>
      <button id="continue-btn" class="btn">Continue →</button>
      <button id="back-btn" class="btn btn-secondary">← Back</button>
    </div>
    <div class="footer">Provided by your administrator. Stored on this device only.</div>
  </div>

  <!-- ─── Loading: redirecting to host ────────────────────────────── -->
  <div id="screen-loading" class="screen">
    <div class="spinner"></div>
    <div class="loading-label" id="loading-label">Opening Sosna…</div>
  </div>

  <script>
    // Update this list AND capacitor.config.json's allowNavigation when
    // a new branch is added.
    const SITES = [
      { id: 'hq',            label: 'Head Office (HQ)', host: 'sosnazm.com' },
      { id: 'kassumbalesa1', label: 'Kassumbalesa 1',   host: 'kassumbalesa1.sosnazm.com' },
      { id: 'lusaka1',       label: 'Lusaka 1',         host: 'lusaka1.sosnazm.com' },
      { id: 'mansa1',        label: 'Mansa 1',          host: 'mansa1.sosnazm.com' },
    ];
    const KEY_SITE    = 'sosna_selected_site_v1';
    const KEY_LICENSE = 'sosna_license_v1';

    function show(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function getSaved(key) {
      try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; }
    }
    function setSaved(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
    }

    function renderChoices() {
      const wrap = document.getElementById('choices');
      wrap.innerHTML = '';
      SITES.forEach(function (s) {
        const btn = document.createElement('button');
        btn.className = 'choice';
        btn.innerHTML = '<span>' + s.label + '</span><span class="badge">' + s.host + '</span>';
        btn.onclick = function () { onBranchPicked(s); };
        wrap.appendChild(btn);
      });
    }

    let pendingSite = null;
    function onBranchPicked(site) {
      pendingSite = site;
      document.getElementById('branch-name').textContent = site.label;
      document.getElementById('branch-host').textContent = site.host;
      document.getElementById('license-input').value = '';
      document.getElementById('license-err').textContent = '';
      document.getElementById('license-input').classList.remove('error');
      show('screen-license');
      // Small delay before focusing — Android sometimes ignores focus during transitions.
      setTimeout(function () { document.getElementById('license-input').focus(); }, 200);
    }

    function onContinue() {
      const raw = document.getElementById('license-input').value || '';
      const license = raw.trim();
      if (license.length < 3) {
        document.getElementById('license-err').textContent = 'License is required.';
        document.getElementById('license-input').classList.add('error');
        return;
      }
      // Persist both (site + license) and load.
      setSaved(KEY_SITE, pendingSite);
      setSaved(KEY_LICENSE, { key: license, siteId: pendingSite.id });
      loadSite(pendingSite);
    }

    function onBack() {
      pendingSite = null;
      show('screen-pick');
    }

    function loadSite(site) {
      show('screen-loading');
      document.getElementById('loading-label').textContent = 'Opening ' + site.label + '…';
      setTimeout(function () {
        // We don't append the license to the URL — keeps it out of the
        // address bar / logs. The web frontend still uses normal user
        // login. License is a local-device identifier for now.
        window.location.href = 'https://' + site.host + '/';
      }, 250);
    }

    document.getElementById('continue-btn').addEventListener('click', onContinue);
    document.getElementById('back-btn').addEventListener('click', onBack);
    document.getElementById('license-input').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); onContinue(); }
    });
    document.getElementById('license-input').addEventListener('input', function () {
      document.getElementById('license-err').textContent = '';
      document.getElementById('license-input').classList.remove('error');
    });

    // Auto-skip if both site + license already saved.
    (function init() {
      const savedSite = getSaved(KEY_SITE);
      const savedLic  = getSaved(KEY_LICENSE);
      if (savedSite && savedSite.host && savedLic && savedLic.key) {
        return loadSite(savedSite);
      }
      renderChoices();
    })();
  </script>
</body>
</html>
