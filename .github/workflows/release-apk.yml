name: Build Mobile APK and Release

# Triggers on any tag starting with "mobile-v" (e.g. mobile-v1.0.0).
# Distinct prefix so it doesn't clash with the Electron release flow which
# fires on push to main.

on:
  push:
    tags:
      - 'mobile-v*'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps
        working-directory: frontend

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
        working-directory: frontend

      - name: Sync Capacitor (copies mobile-shell into the Android project)
        run: npx cap sync android
        working-directory: frontend

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Inject launcher icon into every Android density bucket
        # @capacitor/assets silently fell back to the default Capacitor swirl
        # in the Butchery build, so we stamp the icon directly into each
        # density bucket. Overrides BOTH the legacy bitmap launchers and the
        # adaptive-icon foreground so Android 8+ devices use our icon instead
        # of the template placeholder.
        #
        # v1.10.291 — adaptive-icon FOREGROUND now scales the source image
        # to ~66% of the canvas and pads with transparency to the full FG
        # size. Android 8+ crops adaptive icons through a mask (circle /
        # squircle / square depending on the user's theme); the safe zone
        # for logo content is only the middle ~66×66 dp of the 108×108 dp
        # canvas. The previous full-canvas stamp put the SGD SOSNA circle
        # right against the crop mask edge, so devices with a rounded mask
        # clipped the outer ring + "GENERAL DEALERS" text. Real report
        # 2026-08-02: home-screen icon looked "too zoomed" — only the
        # middle SGD letters survived the crop.
        # Legacy ic_launcher.png / ic_launcher_round.png (Android <=7) are
        # NOT adaptive-cropped, so they still fill the whole bitmap.
        run: |
          ICON=../assets/icon.png
          RES=app/src/main/res
          declare -A LEGACY=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          declare -A FG=( [mdpi]=108 [hdpi]=162 [xhdpi]=216 [xxhdpi]=324 [xxxhdpi]=432 )
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$d"
            convert "$ICON" -resize ${LEGACY[$d]}x${LEGACY[$d]} "$RES/mipmap-$d/ic_launcher.png"
            convert "$ICON" -resize ${LEGACY[$d]}x${LEGACY[$d]} "$RES/mipmap-$d/ic_launcher_round.png"
            INNER=$(( ${FG[$d]} * 66 / 100 ))
            convert "$ICON" -resize ${INNER}x${INNER} -background none -gravity center -extent ${FG[$d]}x${FG[$d]} "$RES/mipmap-$d/ic_launcher_foreground.png"
          done
          ls -la $RES/mipmap-xxxhdpi/
        working-directory: frontend/android

      - name: Set adaptive-icon background to slate navy
        # Android 8+ adaptive icons composite ic_launcher_foreground.png
        # onto a background layer. Capacitor's default background color
        # is #FFFFFF (white), so on launchers with a rounded-square mask
        # (MIUI, most OEM skins) the user sees the SGD SOSNA circle
        # floating inside a white square — visible box around the logo.
        # Overwriting ic_launcher_background.xml to the same slate navy
        # as the sidebar/splash palette makes the mask crop to a dark
        # navy square instead: on circle-mask launchers the badge is
        # seamless, on squircle/rounded-square launchers it reads as
        # a premium dark tile. Real report 2026-08-02 on MIUI: white
        # halo around the SGD circle in the app drawer.
        run: |
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/ic_launcher_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#0F172A</color>
          </resources>
          XML
        working-directory: frontend/android

      - name: Inject splash screen into every Android density bucket
        # Same approach as the icon — stamp splash.png into each drawable
        # folder. Capacitor's SplashScreen plugin reads @drawable/splash.
        run: |
          SPLASH=../assets/splash.png
          RES=app/src/main/res
          declare -A SPLASH_SIZE=( [mdpi]=320 [hdpi]=480 [xhdpi]=720 [xxhdpi]=1080 [xxxhdpi]=1440 )
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/drawable-$d" "$RES/drawable-port-$d" "$RES/drawable-land-$d"
            S=${SPLASH_SIZE[$d]}
            convert "$SPLASH" -resize ${S}x${S} "$RES/drawable-$d/splash.png"
            convert "$SPLASH" -resize ${S}x${S} "$RES/drawable-port-$d/splash.png"
            convert "$SPLASH" -resize ${S}x${S} "$RES/drawable-land-$d/splash.png"
          done
          mkdir -p "$RES/drawable"
          convert "$SPLASH" -resize 480x480 "$RES/drawable/splash.png"
          ls -la $RES/drawable-xxxhdpi/
        working-directory: frontend/android

      - name: Grant gradlew permission
        run: chmod +x gradlew
        working-directory: frontend/android

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: frontend/android

      - name: Rename APK
        run: cp frontend/android/app/build/outputs/apk/debug/app-debug.apk SosnaMobile-${{ github.ref_name }}.apk

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: SosnaMobile-${{ github.ref_name }}.apk
          generate_release_notes: true
          name: Sosna Mobile ${{ github.ref_name }}
