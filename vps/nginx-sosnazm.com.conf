# /etc/nginx/sites-available/sosnazm.com
#
# Single-tenant Sosna POS at sosnazm.com.
# Backend (Node on PM2, port 5300) serves /api/*.
# Nginx serves the React build directly from frontend/build/.
# SPA fallback: any unmatched non-/api path → index.html (React Router).
#
# Apply:
#   sudo cp vps/nginx-sosnazm.com.conf /etc/nginx/sites-available/sosnazm.com
#   sudo nginx -t && sudo systemctl reload nginx

# ── HTTP → HTTPS redirect ───────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name sosnazm.com www.sosnazm.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Main HTTPS server block ─────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sosnazm.com www.sosnazm.com;

    # SSL (managed by Certbot)
    ssl_certificate     /etc/letsencrypt/live/sosnazm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sosnazm.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Where the React build lives on the VPS
    root /var/www/sosna-pos-tenant/frontend/build;
    index index.html;

    client_max_body_size 50M;
    proxy_read_timeout    300s;
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;

    access_log /var/log/nginx/sosnazm.access.log;
    error_log  /var/log/nginx/sosnazm.error.log;

    # ── API + uploads + admin → Node backend on 5300 ────────────────────
    location ~ ^/(api|uploads|admin) {
        proxy_pass         http://127.0.0.1:5300;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_cache_bypass $http_upgrade;
    }

    # ── Static React build with SPA fallback ─────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
