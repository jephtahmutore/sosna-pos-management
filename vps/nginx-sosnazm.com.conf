# /etc/nginx/sites-available/sosnazm.com
#
# Single-tenant Sosna POS at sosnazm.com.
# Backend runs on PM2 process `sosna-tenant` listening on port 5300.
# DNS at Cloudflare is grey (DNS only), so Certbot can use HTTP-01.
#
# Symlink into sites-enabled then test + reload:
#   sudo ln -s /etc/nginx/sites-available/sosnazm.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# ── HTTP → HTTPS redirect (Certbot will touch this block) ───────────────
server {
    listen 80;
    listen [::]:80;
    server_name sosnazm.com www.sosnazm.com;

    # Let Certbot answer the HTTP-01 challenge over HTTP first time
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else goes to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Main HTTPS server block ─────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sosnazm.com www.sosnazm.com;

    # SSL — Certbot will fill these in after running:
    #   sudo certbot --nginx -d sosnazm.com -d www.sosnazm.com
    # ssl_certificate     /etc/letsencrypt/live/sosnazm.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/sosnazm.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Generous body size — GRN uploads + product images need room
    client_max_body_size 50M;

    # Long timeouts for sync requests (initial DB pull can take a minute)
    proxy_read_timeout    300s;
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;

    access_log /var/log/nginx/sosnazm.access.log;
    error_log  /var/log/nginx/sosnazm.error.log;

    # ── API + static frontend → Node backend on 5300 ────────────────────
    location / {
        proxy_pass         http://127.0.0.1:5300;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket / SSE friendly
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
